# arete-mcp-rs: 원격 MCP 서버(파이썬 arete-mcp --http)의 Rust 판.
# 판은 정확히 고정한다. 짓기는 `cargo build --locked --release` 로만.
[package]
name = "arete-mcp-rs"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# TLS 를 넣지 않는다: 같은 기계의 API 만 http 로 부른다 (rustls 의 C 짓기·의존성을 피한다)
reqwest = { version = "=0.13.5", default-features = false }
# 새 판 답을 파이썬처럼 ASCII 로 쓰는 Formatter 가 Serialize 를 부른다 (modern.rs)
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["preserve_order", "arbitrary_precision"] }
ipnet = "=2.12.2"
# 계정 키 확인 결과를 키 해시로 담는다 (키 원문을 메모리 열쇠로 두지 않는다, 파이썬 keys._digest)
sha2 = "=0.11.1"

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
